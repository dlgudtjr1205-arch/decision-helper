<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>내일로 미루자</title>

<style>

* {
  box-sizing: border-box;
}

:root {
  --bg1: #eef2ff;
  --bg2: #f8fafc;
  --card: rgba(255,255,255,.94);
  --text: #111827;
  --sub: #64748b;
  --button: #111827;
  --buttonText: white;
  --shadow: rgba(15,23,42,.12);
  --toggle: #e2e8f0;
}

body.dark {
  --bg1: #0f172a;
  --bg2: #020617;
  --card: rgba(15,23,42,.95);
  --text: #f8fafc;
  --sub: #94a3b8;
  --button: #f8fafc;
  --buttonText: #0f172a;
  --shadow: rgba(0,0,0,.4);
  --toggle: #334155;
}

body {
  margin: 0;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  font-family:
    Arial,
    "Noto Sans KR",
    sans-serif;

  color: var(--text);

  background:
    linear-gradient(
      135deg,
      var(--bg1),
      var(--bg2)
    );

  transition:
    background .4s,
    color .4s;
}


/* 카드 */

.card {
  position: relative;

  width: min(92%, 520px);

  padding: 45px 32px;

  text-align: center;

  background: var(--card);

  border-radius: 30px;

  box-shadow:
    0 25px 70px var(--shadow);

  backdrop-filter: blur(15px);
}


/* 다크모드 버튼 */

.theme {
  position: absolute;

  top: 18px;
  right: 18px;

  width: 46px;
  height: 46px;

  border: none;
  border-radius: 50%;

  background: var(--toggle);

  font-size: 20px;

  cursor: pointer;

  transition:
    transform .2s;
}

.theme:hover {
  transform:
    rotate(15deg)
    scale(1.08);
}


/* 제목 */

h1 {
  margin: 0 0 10px;

  font-size: 40px;

  letter-spacing: -1px;
}


/* 설명 */

.sub {
  margin: 0 0 30px;

  color: var(--sub);

  font-size: 16px;
}


/* 결과 */

.result {
  min-height: 120px;

  display: flex;

  justify-content: center;

  align-items: center;

  font-size: 42px;

  font-weight: 900;

  margin: 10px 0 20px;

  letter-spacing: -2px;
}


/* 결과 등장 */

.result.pop {
  animation:
    pop .65s ease;
}


/* X 표시 */

.cross {
  font-size: 48px;

  margin-top: 5px;

  opacity: 0;

  transform: scale(.4);

  animation:
    crossAppear .5s
    .25s
    forwards;
}


/* 명언 */

.quote {
  margin-top: 20px;

  font-size: 17px;

  line-height: 1.7;

  font-weight: 600;

  color: var(--sub);

  opacity: 0;

  transform: translateY(15px);

  animation:
    quoteAppear .8s
    .65s
    forwards;
}


/* 버튼 */

.decide {
  border: none;

  border-radius: 16px;

  padding: 16px 32px;

  font-size: 18px;

  font-weight: 700;

  cursor: pointer;

  color: var(--buttonText);

  background: var(--button);

  box-shadow:
    0 8px 25px var(--shadow);

  transition:
    transform .15s,
    box-shadow .15s;
}

.decide:hover {
  transform:
    translateY(-3px);
}

.decide:active {
  transform:
    scale(.96);
}

.decide:disabled {
  opacity: .65;

  cursor: default;
}


/* 안내 */

.hint {
  margin-top: 18px;

  font-size: 13px;

  color: var(--sub);
}


/* 결과 돌아가는 효과 */

.rolling {
  animation:
    shake .1s infinite;
}


/* 결과 등장 */

@keyframes pop {

  0% {
    transform:
      scale(.5)
      rotate(-5deg);

    opacity: 0;
  }

  60% {
    transform:
      scale(1.15)
      rotate(2deg);

    opacity: 1;
  }

  100% {
    transform:
      scale(1)
      rotate(0);
  }

}


/* 흔들림 */

@keyframes shake {

  0%,
  100% {
    transform:
      translateX(0);
  }

  25% {
    transform:
      translateX(-8px);
  }

  75% {
    transform:
      translateX(8px);
  }

}


/* X 등장 */

@keyframes crossAppear {

  0% {
    opacity: 0;

    transform:
      scale(.4)
      rotate(-20deg);
  }

  70% {
    opacity: 1;

    transform:
      scale(1.2)
      rotate(5deg);
  }

  100% {
    opacity: 1;

    transform:
      scale(1)
      rotate(0);
  }

}


/* 명언 등장 */

@keyframes quoteAppear {

  0% {
    opacity: 0;

    transform:
      translateY(15px);
  }

  100% {
    opacity: 1;

    transform:
      translateY(0);
  }

}

</style>

</head>


<body>


<main class="card">


  <!-- 다크 / 화이트 모드 -->

  <button
    class="theme"
    id="theme"
    aria-label="테마 변경"
  >
    🌙
  </button>


  <!-- 제목 -->

  <h1>
    오늘 할까?
  </h1>


  <p class="sub">
    너 고민은 여기서 끝이야...
  </p>


  <!-- 결과 -->

  <div
    id="result"
    class="result"
  >
    ?
  </div>


  <!-- X + 명언 -->

  <div
    id="message"
    style="display:none;"
  >

    <div class="cross">
      ❌
    </div>

    <div class="quote">
      "마치지 않고 죽어도 되는 일만 내일로 미뤄라"
      <br>
      — Pablo Picasso —
    </div>

  </div>


  <!-- 버튼 -->

  <button
    class="decide"
    id="decide"
  >
    결정하기
  </button>


  <div class="hint">
    버튼을 누르면 운명이 결정됩니다.
  </div>


</main>



<script>


/* 결과 */

const result =
  document.getElementById("result");

const decide =
  document.getElementById("decide");

const message =
  document.getElementById("message");

const theme =
  document.getElementById("theme");


/* 결정 버튼 */

decide.addEventListener(
  "click",
  () => {

    decide.disabled = true;


    /* 이전 명언 숨기기 */

    message.style.display =
      "none";


    /* 결과 초기화 */

    result.classList.remove(
      "pop"
    );

    result.classList.add(
      "rolling"
    );


    let count = 0;


    /* 랜덤 글자처럼 보여주기 */

    const timer =
      setInterval(
        () => {

          const randomWords = [
            "할까?",
            "하지 말까?",
            "지금 할까?",
            "내일 할까?",
            "조금만 더...",
            "결정 중...",
            "생각하는 중...",
            "운명을 고르는 중..."
          ];


          result.textContent =
            randomWords[
              Math.floor(
                Math.random() *
                randomWords.length
              )
            ];


          count++;


          /* 약 2초 후 결과 */

          if (count >= 22) {

            clearInterval(timer);


            /* 최종 결과는 무조건 이것 */

            result.textContent =
              "내일로 미루자";


            result.classList.remove(
              "rolling"
            );


            void result.offsetWidth;


            result.classList.add(
              "pop"
            );


            /* X + 명언 표시 */

            setTimeout(
              () => {

                message.style.display =
                  "block";

              },
              400
            );


            decide.disabled =
              false;

          }

        },
        85
      );

  }
);


/* 다크모드 */

theme.addEventListener(
  "click",
  () => {

    document.body.classList.toggle(
      "dark"
    );


    const dark =
      document.body.classList.contains(
        "dark"
      );


    theme.textContent =
      dark ? "☀️" : "🌙";


    localStorage.setItem(
      "theme",
      dark ? "dark" : "light"
    );

  }
);


/* 저장된 테마 불러오기 */

if (
  localStorage.getItem("theme")
  === "dark"
) {

  document.body.classList.add(
    "dark"
  );

  theme.textContent =
    "☀️";

}


</script>


</body>
</html>
